name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Cache NASA aero database
        uses: actions/cache@v4
        with:
          path: ~/.cache/morphing-flight-jax
          key: gtm-aero-7f34845a54bcecdd

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Evaluation smoke test
        run: uv run python scripts/evaluate.py --quick --out "$RUNNER_TEMP/eval"
