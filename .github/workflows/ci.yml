name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current. Lint, type check and the evaluation
        # smoke test run once (on 3.13); the test suite runs on both.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install ${{ matrix.python }}
          uv sync --locked --python ${{ matrix.python }}

      - name: Cache NASA aero database
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphing-uav-jax
          key: gtm-aero-7f34845a54bcecdd

      - name: Lint and type check
        if: matrix.python == '3.13'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: Tests
        run: uv run pytest

      - name: Evaluation smoke test
        if: matrix.python == '3.13'
        run: uv run python scripts/evaluate.py --quick --out "$RUNNER_TEMP/eval"
